name: Deploy Traefik

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v6

      - name: Copy compose file to VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/opt/traefik"
          timeout: 60s

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: ACME_EMAIL
          script: |
            set -euo pipefail
            cd /opt/traefik

            # Create .env
            cat > .env <<EOF
            ACME_EMAIL=${ACME_EMAIL}
            EOF

            # Ensure acme.json exists with correct permissions
            touch acme.json
            chmod 600 acme.json

            # Ensure proxy network exists
            docker network inspect proxy >/dev/null 2>&1 || docker network create proxy

            # Pull and deploy
            docker compose pull
            docker compose up -d --remove-orphans

            # Cleanup
            docker image prune -f
            docker compose ps

      - name: Smoke test
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail

            echo "Waiting for Traefik to start..."
            for i in $(seq 1 12); do
              if docker ps --filter "name=traefik" --format "{{.Status}}" | grep -q "Up"; then
                echo "Traefik container is up."
                break
              fi
              if [ "$i" -eq 12 ]; then
                echo "ERROR: Traefik did not start within 60s"
                docker ps --filter "name=traefik" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
                exit 1
              fi
              sleep 5
            done

            echo "Checking Traefik is listening on port 443..."
            sleep 10
            curl -sf --retry 5 --retry-delay 10 --max-time 15 -o /dev/null -w "%{http_code}" https://localhost:443 -k || { echo "WARNING: Traefik not responding on 443"; curl -v https://localhost:443 -k 2>&1 | tail -10; }

            echo "Smoke test completed."
