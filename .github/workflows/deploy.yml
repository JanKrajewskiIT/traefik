name: Deploy Traefik

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_TOKEN,ACME_EMAIL
          script: |
            set -euo pipefail

            REPO_URL="https://${GHCR_TOKEN}@github.com/JanKrajewskiIT/traefik.git"
            DEPLOY_DIR="/opt/traefik"

            # Clone or pull the repo
            if [ -d "${DEPLOY_DIR}/.git" ]; then
              cd "${DEPLOY_DIR}"
              git remote set-url origin "${REPO_URL}"
              git fetch origin main
              git reset --hard origin/main
            else
              rm -rf "${DEPLOY_DIR}"
              git clone --depth 1 --branch main "${REPO_URL}" "${DEPLOY_DIR}"
              cd "${DEPLOY_DIR}"
            fi

            # Create .env (not tracked in git)
            cat > .env <<EOF
            ACME_EMAIL=${ACME_EMAIL}
            EOF

            # Ensure acme.json exists with correct permissions
            touch acme.json
            chmod 600 acme.json

            # Ensure proxy network exists
            docker network inspect proxy >/dev/null 2>&1 || docker network create proxy

            # Pull and deploy
            docker compose pull
            docker compose up -d --remove-orphans

            echo "Traefik deployed successfully."
            docker compose ps
